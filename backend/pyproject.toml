[project]
name = "collect-backend"
version = "0.1.0"
description = "Auction price collector backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "parsel>=1.9",
    "playwright>=1.47",
    "arq>=0.26",
    "pyjwt>=2.9",
    "cryptography>=43",
    "python-dateutil>=2.9",
    "openai>=3.35.1",
    "anthropic>=1.17.0",
    "croniter>=6.2.4",
    "jsonpath-ng>=1.12.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
