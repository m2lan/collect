x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://collect:${POSTGRES_PASSWORD:-collect}@postgres:5432/collect
  REDIS_URL: redis://redis:6379
  SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
  TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
  BACKUP_DIR: /backups

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collect}
      POSTGRES_DB: collect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collect"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    environment: *backend-env
    depends_on:
      api: { condition: service_started }
    shm_size: 1gb
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: python -m app.scheduler
    environment: *backend-env
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: collect
      PGPASSWORD: ${POSTGRES_PASSWORD:-collect}
      PGDATABASE: collect
      TZ: ${TIMEZONE:-Asia/Shanghai}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
